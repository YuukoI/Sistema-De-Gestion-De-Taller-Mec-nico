<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Vehículo</title>
    <link rel="stylesheet" href="../css/vehiculoForm.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<main>
    <div class="form-container">
        <h2 id="formTitle">Agregar Vehículo</h2>
        <form id="vehiculoForm">
            <input type="hidden" id="vehiculoId">
            <div class="form-group">
                <label for="patente">Patente</label>
                <input type="text" class="form-control" id="patente" required>
            </div>
            <div class="form-group">
                <label for="marca">Marca</label>
                <input type="text" class="form-control" id="marca" required>
            </div>
            <div class="form-group">
                <label for="modelo">Modelo</label>
                <input type="text" class="form-control" id="modelo" required>
            </div>
            <div class="form-group">
                <label for="dueno">Dueño</label>
                <input type="text" class="form-control" id="dueno" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="saveBtn">Guardar</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <div class="footer-item">
        <a href="https://www.instagram.com/tuusuario" target="_blank" class="text-white text-decoration-none">
            <i class="bi bi-instagram"></i> Instagram
        </a>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('tel:+541112345678')">
            <i class="bi bi-telephone-fill"></i> +54 11 1234-5678
        </button>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('info@mgautomotriz.com')">
            <i class="bi bi-envelope-fill"></i> info@mgautomotriz.com
        </button>
    </div>
    <div class="footer-item">
        <i class="bi bi-geo-alt-fill"></i> Av.Ejemplo 123
    </div>
    <div class="footer-item">
        <i class="bi bi-clock-fill"></i> Lun-Vie 9:00-18:00
    </div>
</footer>

<script src="../js/auth.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/vehiculoForm.js"></script>
</body>
</html>
