<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Vehículo</title>
    <link rel="stylesheet" href="../css/vehiculoForm.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<div class="form-container">
    <h2 id="formTitle">Agregar Vehículo</h2>
    <form id="vehiculoForm">
        <input type="hidden" id="vehiculoId">
        <div class="form-group">
            <label for="patente">Patente</label>
            <input type="text" class="form-control" id="patente" required>
        </div>
        <div class="form-group">
            <label for="marca">Marca</label>
            <input type="text" class="form-control" id="marca" required>
        </div>
        <div class="form-group">
            <label for="modelo">Modelo</label>
            <input type="text" class="form-control" id="modelo" required>
        </div>
        <div class="form-group">
            <label for="dueno">Dueño</label>
            <input type="text" class="form-control" id="dueno" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Guardar</button>
            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        </div>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/vehiculoForm.js"></script>
</body>
</html>
