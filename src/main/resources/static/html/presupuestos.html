<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Presupuestos</title>
    <link rel="stylesheet" href="../css/presupuestos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <input type="text" id="searchFiltro" class="form-control w-50" placeholder="Buscar por patente o propietario">
        <button id="agregarPresupuestoBtn" class="btn btn-primary">Agregar Presupuesto</button>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Patente</th>
            <th>Propietario</th>
            <th>Descripción</th>
            <th>Total</th>
            <th>Fecha Creado</th>
            <th>Acciones</th>
            <th>PDF</th>
        </tr>
        </thead>
        <tbody id="presupuestosTableBody">
        </tbody>
    </table>

    <div class="d-flex justify-content-end align-items-center gap-2 mt-3">
        <span id="paginaActual" class="pagina-label"></span>
        <button id="prevBtn" class="btn btn-secondary">Anterior</button>
        <button id="nextBtn" class="btn btn-secondary">Siguiente</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/presupuestos.js"></script>
</body>
</html>
