<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="../css/usuariosForm.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<main>
    <div class="form-container">
        <h2 id="formTitle">Editar Usuario</h2>
        <form id="usuarioForm">
            <input type="hidden" id="usuarioId">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>

            <div class="form-group">
                <label for="firstName">Nombre</label>
                <input type="text" class="form-control" id="firstName">
            </div>

            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input type="text" class="form-control" id="lastName">
            </div>

            <div class="form-group">
                <label for="country">País</label>
                <input type="text" class="form-control" id="country">
            </div>

            <div class="form-group">
                <label for="role">Rol</label>
                <select class="form-control" id="role">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <div class="footer-item">
        <a href="https://www.instagram.com/tuusuario" target="_blank" class="text-white text-decoration-none">
            <i class="bi bi-instagram"></i> Instagram
        </a>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('tel:+541112345678')">
            <i class="bi bi-telephone-fill"></i> +54 11 1234-5678
        </button>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('info@mgautomotriz.com')">
            <i class="bi bi-envelope-fill"></i> info@mgautomotriz.com
        </button>
    </div>
    <div class="footer-item">
        <i class="bi bi-geo-alt-fill"></i> Av. Ejemplo 123
    </div>
    <div class="footer-item">
        <i class="bi bi-clock-fill"></i> Lun-Vie 9:00-18:00
    </div>
</footer>

<script src="../js/auth.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/usuariosForm.js"></script>
</body>
</html>
