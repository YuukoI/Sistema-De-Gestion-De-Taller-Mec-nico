<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Repuestos</title>
    <link rel="stylesheet" href="../css/repuestos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu">
    </nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>
<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <input type="text" id="searchNombre" class="form-control w-50" placeholder="Buscar por nombre">
        <button id="agregarRepuestoBtn" class="btn btn-primary">Agregar Repuesto</button>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Stock</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="repuestosTableBody">
        </tbody>
    </table>
    <div class="d-flex justify-content-end align-items-center gap-2 mt-3">
        <span id="paginaActual" class="pagina-label"></span>
        <button id="prevBtn" class="btn btn-secondary">Anterior</button>
        <button id="nextBtn" class="btn btn-secondary">Siguiente</button>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/repuestos.js"></script>
</body>
</html>
