<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Presupuesto</title>
    <link rel="stylesheet" href="../css/presupuestoForm.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<div class="form-container">
    <h2 id="formTitle">Agregar Presupuesto</h2>
    <form id="presupuestoForm">
        <input type="hidden" id="presupuestoId">

        <div class="form-group">
            <label for="patente">Patente</label>
            <input type="text" class="form-control" id="patente" required>
        </div>

        <div class="form-group">
            <label for="nombrePropietario">Propietario</label>
            <input type="text" class="form-control" id="nombrePropietario" required>
        </div>

        <div class="form-group">
            <label for="marca">Marca</label>
            <input type="text" class="form-control" id="marca">
        </div>

        <div class="form-group">
            <label for="modelo">Modelo</label>
            <input type="text" class="form-control" id="modelo">
        </div>

        <div class="form-group">
            <label for="manoDeObra">Mano de obra</label>
            <input type="number" class="form-control" id="manoDeObra" step="0.01">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea class="form-control" id="descripcion"></textarea>
        </div>

        <div class="form-group">
            <label for="total">Total</label>
            <input type="number" class="form-control" id="total" step="0.01">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Guardar</button>
            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        </div>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/presupuestoForm.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
