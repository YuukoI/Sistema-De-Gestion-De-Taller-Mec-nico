<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/formRegister.css">
    <title>Registrar</title>
</head>
<body>
<div class="wrapper fadeInDown">
    <div id="formContent">

        <h2 class="inactive underlineHover" id="goLogin">Acceder</h2>
        <h2 class="active">Registrar</h2>

        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="text" id="lastname" placeholder="Apellido" required>
            <input type="text" id="firstname" placeholder="Nombre" required>
            <input type="text" id="country" placeholder="País" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <input type="submit" value="Registrar">
        </form>

    </div>
</div>
<script src="../js/formRegister.js"></script>
</body>
</html>
