<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Repuesto</title>
    <link rel="stylesheet" href="../css/repuestoForm.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<div class="form-container">
    <h2 id="formTitle">Agregar Repuesto</h2>
    <form id="repuestoForm">
        <input type="hidden" id="repuestoId">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" class="form-control" id="stock" min="1" required>
        </div>
        <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" class="form-control" id="precio" min="0.01" step="0.01" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Guardar</button>
            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        </div>
    </form>
</div>
<script src="../js/auth.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/repuestoForm.js"></script>
</body>
</html>
