<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logs</title>
    <link rel="stylesheet" href="../css/logs.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<main class="container mt-4">
    <div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
        <input type="text" id="searchInput" class="form-control w-50" placeholder="Buscar por usuario o acción">
        <button id="deleteAllLogsBtn" class="btn btn-danger">Borrar Todos</button>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Acción</th>
            <th>Método</th>
            <th>Detalles</th>
            <th>Fecha</th>
        </tr>
        </thead>
        <tbody id="logsTableBody"></tbody>
    </table>

    <div class="d-flex justify-content-end align-items-center gap-2 mt-3 flex-wrap">
        <span id="paginaActual" class="pagina-label"></span>
        <button id="prevBtn" class="btn btn-secondary">Anterior</button>
        <button id="nextBtn" class="btn btn-secondary">Siguiente</button>
    </div>
</main>

<div id="descModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="cerrarModal()">×</span>
        <p id="descText"></p>
    </div>
</div>

<footer class="footer">
    <div class="footer-item">
        <a href="https://www.instagram.com/tuusuario" target="_blank" class="text-white text-decoration-none">
            <i class="bi bi-instagram"></i> Instagram
        </a>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('tel:+541112345678')">
            <i class="bi bi-telephone-fill"></i> +54 11 1234-5678
        </button>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('info@mgautomotriz.com')">
            <i class="bi bi-envelope-fill"></i> info@mgautomotriz.com
        </button>
    </div>
    <div class="footer-item">
        <i class="bi bi-geo-alt-fill"></i> Av.Ejemplo 123
    </div>
    <div class="footer-item">
        <i class="bi bi-clock-fill"></i> Lun-Vie 9:00-18:00
    </div>
</footer>

<script src="../js/auth.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/logs.js"></script>
</body>
</html>
