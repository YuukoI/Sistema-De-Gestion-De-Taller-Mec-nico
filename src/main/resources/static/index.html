<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Automotriz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<header>
    <div class="logo">MG Automotriz</div>
    <nav id="navMenu"></nav>
    <div class="user">
        <button id="usernameBtn">Acceder</button>
        <div id="userDropdown" class="dropdown">
            <button id="logoutBtn">Salir</button>
        </div>
    </div>
</header>

<main>
    <div class="dashboard">
        <div class="dashboard-row top">
            <div class="card small">
                <h3>Presupuestos Mes</h3>
                <p id="presupuestos-mes">0</p>
            </div>
            <div class="card small">
                <h3>Presupuestos Semana</h3>
                <p id="presupuestos-semana">0</p>
            </div>
            <div class="card small">
                <h3>Ingresos Mes</h3>
                <p id="ingresos-mes">0</p>
            </div>
            <div class="card small">
                <h3>Ingresos Semana</h3>
                <p id="ingresos-semana">0</p>
            </div>
        </div>

        <div class="dashboard-row charts">
            <div class="chart-box">
                <h2>Ingresos del Mes</h2>
                <canvas id="graficoMes"></canvas>
            </div>
            <div class="chart-box">
                <h2>Ingresos de la Semana</h2>
                <canvas id="graficoSemana"></canvas>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-item">
        <a href="https://www.instagram.com/tuusuario" target="_blank" class="text-white text-decoration-none">
            <i class="bi bi-instagram"></i> Instagram
        </a>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('tel:+541112345678')">
            <i class="bi bi-telephone-fill"></i> +54 11 1234-5678
        </button>
    </div>
    <div class="footer-item">
        <button class="footer-btn" onclick="copiarTexto('info@mgautomotriz.com')">
            <i class="bi bi-envelope-fill"></i> info@mgautomotriz.com
        </button>
    </div>
    <div class="footer-item">
        <i class="bi bi-geo-alt-fill"></i> Av.Ejemplo 123
    </div>
    <div class="footer-item">
        <i class="bi bi-clock-fill"></i> Lun-Vie 9:00-18:00
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/index.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
